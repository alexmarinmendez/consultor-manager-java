plugins {
    id 'application'
}

group = 'pe.cibertec'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.mysql:mysql-connector-j:9.5.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'pe.cibertec.consultormanager.App'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
